[package]
name = "journey-bot"
version = "0.1.0"
edition = "2024"
default-run = "journey-bot"

[[bin]]
name = "journey-bot"
path = "src/bin/main.rs"

[dependencies]
binary-heap-plus = "0.5.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
config = { version = "0.15.25", features = ["toml"], default-features = false }
csv = "1.4.0"
cuid2 = "0.1.6"
jsonwebtoken = "11.0.0"
poise = { version = "0.6.2", features = [
  "default",
  "handle_panics",
], default-features = false }
rapidfuzz = "0.5.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = [
  "rustls",
], default-features = false }
roux = { version = "2.2.15", features = [
  "rustls",
], default-features = false, optional = true }
sea-entity = { path = "../sea-entity" }
sea-migration = { path = "../sea-migration" }
sea-orm = { version = "2.0.0", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
secstr = { version = "0.5.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-xml-rs = "0.8.2"
serde_json = "1.0.151"
tokio = "1.53.1"
tokio-retry2 = { version = "0.9.1", features = ["tracing"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
twitch_api = { version = "0.8.0", features = [
  "client",
  "helix",
  "reqwest",
  "twitch_oauth2",
] }
unicode-normalization = "0.1.25"

[features]
reddit-api = ["dep:roux"]
